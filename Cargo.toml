[package]
name = "diffusion-bot-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diffusion-bot-rust"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
dotenv = "0.15.0"
env_logger = "0.11.8"
futures = "0.3.31"
futures-util = "0.3.31"
image = { version="0.25.9", features = ["png", "jpeg", "webp"] }
log = "0.4.29"
once_cell = "1.21.3"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version="0.12", features = ["json", "multipart"] }
reqwest-eventsource = "0.6.0"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.18"
twilight-cache-inmemory = "0.17.1"
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-interactions = "0.17.0"
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }
twilight-validate = "0.17.0"
solana-sdk = "3"
solana-client = "3"
spl-token = "9"
spl-associated-token-account = "8"
sha2 = "0.10.9"
hex = "0.4.3"
