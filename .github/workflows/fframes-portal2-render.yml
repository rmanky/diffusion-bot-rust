name: fframes Portal 2 isolated render

on:
  push:
    branches:
      - fframes-portal2-render-20261010
    paths:
      - 'fframes_portal2_ci/**'
      - '.github/workflows/fframes-portal2-render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config clang cmake
      - name: Patch fframes source for 1.2.0
        working-directory: fframes_portal2_ci
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib.rs')
          s = p.read_text()
          for a,b in [
            ('pub const DURATION: f64','pub const DURATION: f32'),
            ('fn c(x:f64)->f64','fn c(x:f32)->f32'),
            ('fn p(t:f64,a:f64,b:f64)->f64','fn p(t:f32,a:f32,b:f32)->f32'),
            ('fn a(t:f64,s:f64,e:f64)->f64','fn a(t:f32,s:f32,e:f32)->f32'),
            ('fn lyric(t:f64)','fn lyric(t:f32)'),
            ('const C:&[(f64,&str)]','const C:&[(f32,&str)]'),
            ('star*.3','star*0.3'),('star*.6','star*0.6'),('star*.4','star*0.4'),
            ('q12-.45','q12-0.45'),('/.25','/0.25'),('q11-.5','q11-0.5')
          ]:
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Render with fframes 1.2.0
        working-directory: fframes_portal2_ci
        run: cargo run --release -- render
      - name: Inspect rendered video
        working-directory: fframes_portal2_ci
        run: ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 out.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: portal2-fframes-render
          path: fframes_portal2_ci/out.mp4
          compression-level: 0
          retention-days: 1
