name: fframes Portal 2 isolated render

on:
  push:
    branches:
      - fframes-portal2-render-20261010
    paths:
      - 'fframes_portal2_ci/**'
      - '.github/workflows/fframes-portal2-render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config clang cmake
      - name: Render with fframes 1.2.0
        working-directory: fframes_portal2_ci
        run: cargo run --release -- render
      - name: Inspect rendered video
        working-directory: fframes_portal2_ci
        run: ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 out.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: portal2-fframes-render
          path: fframes_portal2_ci/out.mp4
          compression-level: 0
          retention-days: 1
